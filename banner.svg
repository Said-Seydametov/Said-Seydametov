<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="SS|T — Said Seydametov, software engineer">
  <title>SS|T — Said Seydametov</title>
  <defs>
    <clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath>
    <radialGradient id="sky" cx="0.78" cy="0" r="0.9">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.62" cy="0" r="0.5">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.35" stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#868686"/>
      <stop offset="0.55" stop-color="#ababab"/>
      <stop offset="1" stop-color="#c9c9c9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="letters-mask">
      <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M 568.3 107.2 C 561.9 101.2, 551.0 100.0, 538.2 100.0 C 519.0 100.0, 507.5 104.8, 507.5 115.0 C 507.5 125.2, 519.0 128.2, 538.2 130.0 C 557.4 131.8, 568.9 134.8, 568.9 145.0 C 568.9 155.2, 557.4 160.0, 538.2 160.0 C 525.4 160.0, 513.9 158.2, 506.2 151.6"/>
      <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M 664.3 107.2 C 657.9 101.2, 647.0 100.0, 634.2 100.0 C 615.0 100.0, 603.5 104.8, 603.5 115.0 C 603.5 125.2, 615.0 128.2, 634.2 130.0 C 653.4 131.8, 664.9 134.8, 664.9 145.0 C 664.9 155.2, 653.4 160.0, 634.2 160.0 C 621.4 160.0, 609.9 158.2, 602.2 151.6"/>
      <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M 711.7 101.8 H 773.8 M 742.8 101.8 V 159.1"/>
    </mask>
    <filter id="blur-lg" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-sm" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <style>
    .breathe { animation: breathe 8s ease-in-out infinite; }
    .sweep { animation: sweep 8s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes breathe { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
    @keyframes sweep { 0% { transform: translateX(-300px) } 45%,100% { transform: translateX(1300px) } }
    @media (prefers-reduced-motion: reduce) { .breathe, .sweep { animation: none } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#sky)"/>

    <!-- атмосфера над горизонтом -->
    <g class="breathe">
      <ellipse cx="768" cy="274" rx="420" ry="26" fill="#cfcfcf" opacity="0.16" filter="url(#blur-lg)"/>
      <circle cx="640.0" cy="1418" r="1150" fill="none" stroke="url(#rim)" stroke-width="5" opacity="0.5" filter="url(#blur-sm)"/>
    </g>
    <!-- сфера -->
    <circle cx="640.0" cy="1418" r="1150" fill="url(#planet)"/>
    <circle cx="640.0" cy="1418" r="1150" fill="none" stroke="url(#rim)" stroke-width="1.1"/>

    <rect width="1280" height="360" filter="url(#grain)"/>

    <!-- логотип -->
    <g fill="none" stroke="url(#ink)" stroke-width="1.5" stroke-linecap="round">
      <path d="M 568.3 107.2 C 561.9 101.2, 551.0 100.0, 538.2 100.0 C 519.0 100.0, 507.5 104.8, 507.5 115.0 C 507.5 125.2, 519.0 128.2, 538.2 130.0 C 557.4 131.8, 568.9 134.8, 568.9 145.0 C 568.9 155.2, 557.4 160.0, 538.2 160.0 C 525.4 160.0, 513.9 158.2, 506.2 151.6"/>
      <path d="M 664.3 107.2 C 657.9 101.2, 647.0 100.0, 634.2 100.0 C 615.0 100.0, 603.5 104.8, 603.5 115.0 C 603.5 125.2, 615.0 128.2, 634.2 130.0 C 653.4 131.8, 664.9 134.8, 664.9 145.0 C 664.9 155.2, 653.4 160.0, 634.2 160.0 C 621.4 160.0, 609.9 158.2, 602.2 151.6"/>
      <path d="M 711.7 101.8 H 773.8 M 742.8 101.8 V 159.1"/>
    </g>
    <line x1="692.1" y1="82.6" x2="692.1" y2="174.4" stroke="#5f5f5f" stroke-width="1.1"/>
    <g mask="url(#letters-mask)">
      <rect class="sweep" x="0" y="82.6" width="220" height="91.8" fill="url(#sheen)"/>
    </g>

    <text x="640.0" y="226" text-anchor="middle"
      font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400"
      letter-spacing="6.5" fill="#8c8c8c">SAID SEYDAMETOV  ·  SOFTWARE ENGINEER</text>
  </g>
</svg>
